name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-duplicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.check.outcome == 'success' && steps.check.outputs.should_skip == 'true' }}
    steps:
    - name: Check for a successful duplicate
      id: check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      # An API failure must fall back to running CI.
      continue-on-error: true
      with:
        # Only reuse completed successes; a running build could still fail or be cancelled.
        concurrent_skipping: 'never'
        skip_after_successful_duplicate: 'true'
        cancel_others: 'false'
        do_not_skip: '["workflow_dispatch","schedule","merge_group","release"]'

  test:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    name: Build and test (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev lcov

      - name: Configure
        run: |
          cmake -S tests -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFLOCKSTORM_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Collect coverage data
        run: |
          lcov --capture \
               --directory build \
               --output-file coverage.info \
               --ignore-errors mismatch

      - name: Filter coverage data
        run: |
          lcov --remove coverage.info \
               '/usr/*' \
               '*/catch2/*' \
               '*/vectorstorm/*' \
               '*/memorystorm/*' \
               '*/tests/*' \
               --output-file coverage.info \
               --ignore-errors unused

      - name: Show coverage summary
        run: lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
